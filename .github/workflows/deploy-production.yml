name: Production deployment

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify approved release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Production deployments must be started from the main branch."
          exit 1

      - name: Require successful CI for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              event: "push",
              status: "completed",
              per_page: 20,
            });
            const passed = response.data.workflow_runs.some(
              (run) => run.head_sha === context.sha && run.conclusion === "success",
            );
            if (!passed) {
              core.setFailed(`Commit ${context.sha} does not have a successful CI run.`);
            }

  deploy:
    name: Deploy immutable release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://finhand.duckdns.org
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      API_REPOSITORY: finhand-prod-api-ecr
      PUBLIC_WEB_ORIGIN: https://finhand.duckdns.org
      WEB_REPOSITORY: finhand-prod-web-ecr
    steps:
      - name: Check out the approved commit
        uses: actions/checkout@v5

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: finhand-production-${{ github.run_id }}
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for existing immutable images
        id: images
        run: |
          web_exists=false
          api_exists=false
          if aws ecr describe-images --repository-name "$WEB_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" > /dev/null 2>&1; then
            web_exists=true
          fi
          if aws ecr describe-images --repository-name "$API_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" > /dev/null 2>&1; then
            api_exists=true
          fi
          echo "web_exists=$web_exists" >> "$GITHUB_OUTPUT"
          echo "api_exists=$api_exists" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for ARM64 images
        if: steps.images.outputs.web_exists != 'true' || steps.images.outputs.api_exists != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.images.outputs.web_exists != 'true' || steps.images.outputs.api_exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and publish the API image
        if: steps.images.outputs.api_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=production-api
          cache-to: type=gha,mode=max,scope=production-api
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ github.sha }}

      - name: Build and publish the web image
        if: steps.images.outputs.web_exists != 'true'
        uses: docker/build-push-action@v6
        with:
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_WEB_ORIGIN }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:${{ github.sha }}

      - name: Update production and deploy through Systems Manager
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash deploy/production/deploy-from-github.sh

