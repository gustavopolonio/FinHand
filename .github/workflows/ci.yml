name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_USER: finhand_test
          POSTGRES_PASSWORD: finhand_test
          POSTGRES_DB: finhand_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finhand_test -d finhand_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://finhand_test:finhand_test@127.0.0.1:5432/finhand_test
        run: npm run test:integration

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build production applications
        run: npm run build

      - name: Validate generated migrations are committed
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/finhand_ci
        run: |
          npm run db:generate
          migration_changes="$(git status --porcelain --untracked-files=all -- apps/api/drizzle)"
          if [ -n "$migration_changes" ]; then
            echo "Drizzle generated migration changes that are not committed:"
            echo "$migration_changes"
            exit 1
          fi
