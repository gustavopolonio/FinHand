name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Build production applications
        run: npm run build

      - name: Validate generated migrations are committed
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/finhand_ci
        run: |
          npm run db:generate
          migration_changes="$(git status --porcelain --untracked-files=all -- apps/api/drizzle)"
          if [ -n "$migration_changes" ]; then
            echo "Drizzle generated migration changes that are not committed:"
            echo "$migration_changes"
            exit 1
          fi
